<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Checkout - Web Extend Test Shop</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="checkout">
  <header id="site-header"></header>
  <main>
    <h1>Checkout</h1>
    <div id="checkout">
      <p class="notice warn">Synthetic data only. Do not enter real personal details. There is no payment step.</p>
      <h2>Order summary</h2>
      <ul id="summary"></ul>
      <h2>Delivery details</h2>
      <!-- Pre-filled with obviously fake values; example.invalid can never receive mail. -->
      <form id="checkout-form" class="stack">
        <label>Name <input name="name" value="Test Person" required></label>
        <label>Email <input name="email" type="email" value="test.person@example.invalid" required></label>
        <label>Address <input name="address" value="1 Example Street" required></label>
        <label>City <input name="city" value="Testville" required></label>
        <button class="btn" type="submit">Place synthetic order</button>
      </form>
    </div>
  </main>
  <script src="js/debug-console.js"></script>
  <script src="js/web-extend.js"></script>
  <script src="js/store.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
